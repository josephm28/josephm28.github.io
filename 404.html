<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Joseph Malone</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f3d6e">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--ink:#1b1f24;--muted:#5b6470;--line:#e3e1da;--accent:#0f3d6e;--accent-ink:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#111418;--ink:#e8eaed;--muted:#9aa3ad;--line:#2a3038;--accent:#7fb2ea;--accent-ink:#0d1520}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:20px;text-align:center}
.code{font-family:Newsreader,Georgia,serif;font-size:clamp(4rem,14vw,6.5rem);font-weight:600;line-height:1;color:var(--accent);margin:0}
h1{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:1.6rem;margin:12px 0 6px}
p{color:var(--muted);margin:0 0 24px}
a.btn{display:inline-block;padding:9px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:500;text-decoration:none}
a.btn:hover{opacity:.9}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>That page doesn't exist, but my site does.</p>
  <a class="btn" href="/">Go to josephmalone.com</a>
</main>
</body>
</html>
